name: Deploy GAS

on:
  push:
    branches:
      - main
    paths:
      - '**.gs'
      - '**.js'
      - '**.html'
      - 'appsscript.json'
      - '.clasp.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        run: |
          printf '%s' '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Show authorized user
        run: clasp show-authorized-user --json

      - name: Push to Apps Script
        run: clasp push
